<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonox Real Estate Demo</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Arial, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #08111f;
      color: #f8fafc;
    }
    main { width: min(760px, calc(100% - 32px)); text-align: center; }
    .badge {
      display: inline-flex;
      padding: 8px 12px;
      border: 1px solid rgba(79,140,255,.25);
      border-radius: 999px;
      color: #9fc0ff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: clamp(42px, 7vw, 74px); line-height: 1; }
    p { max-width: 640px; margin: 22px auto 34px; color: #a8b4c7; font-size: 18px; line-height: 1.6; }
    .hint { color: #f5c35a; font-size: 14px; margin-top: 26px; }
  </style>
</head>
<body>
  <main>
    <div class="badge">Sonox Real Estate Demo</div>
    <h1>Never Miss a Property Inquiry</h1>
    <p>AI receptionist demo for buyer enquiries, viewing requests, seller valuations, lettings, and lead capture.</p>
    <div class="hint">Use the phone button in the bottom-right corner to start the demo call.</div>
  </main>

  <script>
    const assistant = '26f9db02-f0c8-49ee-bf5f-a25c63f9d721';
    const apiKey = 'c6c682a7-d151-470a-bee5-6818d2f13176';
    const buttonConfig = {
      position: 'bottom-right',
      offset: '28px',
      width: '64px',
      height: '64px',
      idle: {
        color: 'rgb(49, 111, 244)',
        type: 'round',
        icon: 'https://unpkg.com/lucide-static@0.321.0/icons/phone.svg'
      },
      loading: {
        color: 'rgb(245, 185, 66)',
        type: 'round',
        icon: 'https://unpkg.com/lucide-static@0.321.0/icons/loader-2.svg'
      },
      active: {
        color: 'rgb(239, 95, 108)',
        type: 'round',
        icon: 'https://unpkg.com/lucide-static@0.321.0/icons/phone-off.svg'
      }
    };

    (function (d, t) {
      const g = document.createElement(t);
      const s = d.getElementsByTagName(t)[0];
      g.src = 'https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js';
      g.defer = true;
      g.async = true;
      s.parentNode.insertBefore(g, s);
      g.onload = function () {
        window.vapiInstance = window.vapiSDK.run({
          apiKey: apiKey,
          assistant: assistant,
          config: buttonConfig
        });
      };
    })(document, 'script');
  </script>
</body>
</html>
